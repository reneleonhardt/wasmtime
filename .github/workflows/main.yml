name: CI
on:
  push:
    branches: [ci/bounded-dns-resolution]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_BUILD_JOBS: 2
  CARGO_HTTP_TIMEOUT: 60
  CARGO_NET_RETRY: 2

jobs:
  dns-cancellation:
    name: DNS queued cancellation (${{ matrix.os }})
    if: github.repository == 'reneleonhardt/wasmtime'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    steps:
    - uses: actions/checkout@v7

    - name: Install Rust
      timeout-minutes: 5
      run: |
        rustup toolchain install 1.99.0 --profile minimal --no-self-update
        rustup default 1.99.0

    - uses: actions/cache@v6
      timeout-minutes: 3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-dns-unit-1.99-${{ hashFiles('Cargo.lock', 'crates/wasi/src/sockets/ip_name_lookup.rs') }}
        restore-keys: ${{ runner.os }}-dns-unit-1.99-

    - name: Check selected unit test exists
      run: |
        cargo test --locked --lib -p wasmtime-wasi --no-default-features --features p2,p3 \
          sockets::ip_name_lookup::tests::cancellation_before_worker_start \
          -- --exact --list --format terse | \
          grep -Fx 'sockets::ip_name_lookup::tests::cancellation_before_worker_start: test'

    - name: Test queued cancellation
      timeout-minutes: 1
      run: |
        cargo test --locked --lib -p wasmtime-wasi --no-default-features --features p2,p3 \
          sockets::ip_name_lookup::tests::cancellation_before_worker_start \
          -- --exact --test-threads=1
